name: Publish curated archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Restore pinned viewer dependencies
        run: npm ci --prefix viewer --no-audit --no-fund
      - name: Check portal JavaScript
        run: |
          node --check assets/site.js
          node --check assets/downloads.js
          node --check assets/i18n.js
          node --check assets/assembly.js
      - name: Build both languages from shared templates
        run: |
          node viewer/scripts/extract-i18n.mjs
          python3 tools/localize_pages.py build
      - name: Verify actual candidate data and viewer contracts
        run: npm test --prefix viewer
      - name: Verify isolated native import boundaries
        run: python3 -m unittest discover -s tools/tests
      - name: Rebuild the self-contained viewer
        run: npm run build --prefix viewer
      - name: Verify public hashes, coverage, privacy and links
        run: |
          python3 tools/validate_archive.py
          python3 tools/validate_bilingual.py
      - name: Stage only the audited public payload
        run: python3 tools/build_site.py
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy audited artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
